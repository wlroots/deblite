[project]
name = "deblite-installer"
version = "0.1.0"
description = "DebLite installer: partition, copy the live rootfs, configure GRUB/LUKS/users"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DebLite" }]
dependencies = []

[project.optional-dependencies]
gui = ["PyGObject>=3.46"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
deblite-installer = "installer.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["installer*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
