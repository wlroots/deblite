name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck dpkg-dev

      - name: ruff
        run: ruff check installer tests

      - name: pytest
        run: python -m pytest -q

      - name: shellcheck
        run: shellcheck scripts/*.sh bin/deblite-installer

      - name: build installer deb
        run: ./scripts/build-installer-deb.sh

      - name: upload installer deb
        uses: actions/upload-artifact@v4
        with:
          name: deblite-installer-deb
          path: out/*.deb
          retention-days: 7
