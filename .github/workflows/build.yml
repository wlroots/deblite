name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Edition to build"
        type: choice
        default: all
        options: [all, kde, gnome, xfce, cinnamon]
      debian_version:
        description: "Debian point release label (informational)"
        type: string
        default: "13.7"
      release:
        description: "Publish a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        flavor: [kde, gnome, xfce, cinnamon]

    steps:
      - name: decide whether this flavor is requested
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ inputs.flavor }}"
          if [ -z "$requested" ] || [ "$requested" = "all" ] || [ "$requested" = "${{ matrix.flavor }}" ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "skipping ${{ matrix.flavor }} (requested: $requested)"
          fi

      - name: install checkout prerequisites
        if: steps.gate.outputs.run == 'true'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: install build dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools \
            syslinux syslinux-common isolinux \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            rsync curl ca-certificates gnupg \
            python3-pytest shellcheck

      - name: show disk space
        if: steps.gate.outputs.run == 'true'
        run: df -h

      - name: build ISO
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          flavor="${{ matrix.flavor }}"
          version="${{ inputs.debian_version }}"
          if [ -z "$version" ]; then
            version="$(cat debian-version.txt 2>/dev/null || echo 13.7)"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/build-iso.sh "$flavor" --compress zstd --debian-version "$version"
          else
            ./scripts/build-iso.sh "$flavor" --release --debian-version "$version"
          fi

      - name: upload ISO
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.flavor }}
          path: |
            out/*.iso
            out/*.sha256
            out/*.manifest.json
          retention-days: 14
          compression-level: 0

  release:
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="v${{ inputs.debian_version }}"
          fi
          if [ -z "$tag" ] || [ "$tag" = "main" ]; then
            tag="v$(date -u +%Y.%m.%d)"
          fi

          mapfile -t files < <(
            find artifacts -type f \
              \( -name '*.iso' -o -name '*.sha256' -o -name '*.manifest.json' \) |
              sort
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release files found" >&2
            exit 1
          fi

          notes=$(mktemp)
          {
            echo "DebLite 13 images"
            echo
            echo "Built from Debian $(cat debian-version.txt 2>/dev/null || echo 13.x)."
            echo
            for manifest in artifacts/*.manifest.json; do
              [ -f "$manifest" ] || continue
              echo "- \`$(basename "$manifest" .manifest.json)\`"
            done
          } >"$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "DebLite $tag" \
              --notes-file "$notes"
          fi
